<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <linearGradient id="glowPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <style>
      @keyframes floatLeft {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(-1.5deg); }
      }
      @keyframes floatRight {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(14px) rotate(2deg); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }

      .floating-card-1 {
        animation: floatLeft 7s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatRight 8s ease-in-out infinite 1s;
      }
      .pill-float {
        animation: floatSlow 5s ease-in-out infinite 0.5s;
      }
      .pulse-ambient {
        animation: pulseGlow 6s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .flow-line {
        stroke-dasharray: 8, 8;
        animation: dashMove 2.5s linear infinite;
      }
      .title-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .body-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Blueprint Background Grid -->
  <rect width="1200" height="400" rx="16" fill="url(#grid)" />

  <!-- Dynamic Background Ambient Glow Orbs -->
  <circle cx="200" cy="90" r="140" fill="url(#glowPulse)" filter="url(#blurFilter)" class="pulse-ambient" />
  <circle cx="1020" cy="310" r="160" fill="#8b5cf6" opacity="0.18" filter="url(#blurFilter)" class="pulse-ambient" />

  <!-- Dynamic Interactive Wireframe Flow Connections (Background / Midground) -->
  <g opacity="0.35">
    <path class="flow-line" d="M 190 280 C 260 330, 340 330, 420 280" fill="none" stroke="#ec4899" stroke-width="2" />
    <path class="flow-line" d="M 780 120 C 860 60, 940 80, 1010 130" fill="none" stroke="#3b82f6" stroke-width="2" />
  </g>

  <!-- Dynamic Decorative UI Component Cards (Positioned on the flanks to NEVER occlude central titles) -->
  
  <!-- Left Side: Prototype Wireframe Component Card -->
  <g class="floating-card-1" transform="translate(45, 110)" filter="url(#shadowFilter)">
    <rect width="210" height="180" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" backdrop-filter="blur(10px)" />
    <!-- Window controls -->
    <circle cx="22" cy="20" r="4" fill="#ef4444" />
    <circle cx="36" cy="20" r="4" fill="#f59e0b" />
    <circle cx="50" cy="20" r="4" fill="#10b981" />
    <!-- Skeleton layout -->
    <rect x="20" y="42" width="70" height="12" rx="4" fill="rgba(255,255,255,0.2)" />
    <rect x="20" y="66" width="170" height="34" rx="6" fill="#8b5cf6" opacity="0.25" stroke="#8b5cf6" stroke-width="1" />
    <rect x="32" y="78" width="55" height="10" rx="3" fill="#a78bfa" />
    <!-- Wireframe grid elements -->
    <rect x="20" y="112" width="48" height="46" rx="6" fill="rgba(255,255,255,0.06)" />
    <rect x="80" y="112" width="48" height="46" rx="6" fill="rgba(255,255,255,0.06)" />
    <rect x="140" y="112" width="50" height="46" rx="6" fill="rgba(255,255,255,0.06)" />
  </g>

  <!-- Right Side: Design-to-Code Handoff / Canvas Card -->
  <g class="floating-card-2" transform="translate(945, 115)" filter="url(#shadowFilter)">
    <rect width="210" height="180" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" backdrop-filter="blur(10px)" />
    <!-- Header -->
    <rect x="18" y="20" width="80" height="10" rx="3" fill="#ec4899" opacity="0.8" />
    <rect x="156" y="18" width="36" height="14" rx="7" fill="#10b981" opacity="0.3" />
    <!-- Interactive layers -->
    <rect x="18" y="44" width="174" height="24" rx="5" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" />
    <circle cx="32" cy="56" r="5" fill="#3b82f6" />
    <rect x="46" y="52" width="80" height="8" rx="2" fill="rgba(255,255,255,0.4)" />
    
    <rect x="18" y="76" width="174" height="24" rx="5" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" />
    <circle cx="32" cy="88" r="5" fill="#ec4899" />
    <rect x="46" y="84" width="95" height="8" rx="2" fill="rgba(255,255,255,0.4)" />
    
    <!-- Code tokens pill -->
    <rect x="18" y="112" width="174" height="46" rx="6" fill="#030712" stroke="rgba(99,102,241,0.3)" stroke-width="1" />
    <text x="28" y="132" fill="#6ee7b7" font-family="monospace" font-size="11">&lt;Button variant="ui" /&gt;</text>
    <text x="28" y="148" fill="#93c5fd" font-family="monospace" font-size="10">display: flex; gap: 8px;</text>
  </g>

  <!-- FOREGROUND: High-priority Title, Subtitle, and Feature Badges (Always in Front) -->
  <g id="central-content" transform="translate(600, 0)">
    
    <!-- Top Category Tag -->
    <g transform="translate(0, 68)" class="pill-float">
      <rect x="-145" y="-14" width="290" height="28" rx="14" fill="rgba(139, 92, 246, 0.16)" stroke="#8b5cf6" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="700" letter-spacing="0.08em" class="title-text">
        ⚡ CURATED ECOSYSTEM &amp; BENCHMARKS
      </text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <text x="0" y="148" text-anchor="middle" font-size="44" fill="url(#accentGrad)" class="title-text" filter="url(#shadowFilter)">
      Awesome Design &amp; Prototyping
    </text>

    <!-- Subtitle (Clear, crisp, high contrast) -->
    <text x="0" y="196" text-anchor="middle" font-size="19" fill="#f3f4f6" font-weight="500" class="body-text">
      The Complete Guide to UI/UX Design, Interactive Prototyping &amp; Design-to-Code
    </text>

    <text x="0" y="228" text-anchor="middle" font-size="14" fill="#9ca3af" font-weight="400" class="body-text">
      Comparing Leading SaaS Platforms with Self-Hosted Open-Source Alternatives
    </text>

    <!-- Ecosystem Metric Badges in Foreground -->
    <g transform="translate(0, 288)">
      <!-- Pill 1: SaaS Leaders -->
      <g transform="translate(-200, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
        <circle cx="-62" cy="0" r="5" fill="#3b82f6" />
        <text x="-48" y="5" fill="#e5e7eb" font-size="12" font-weight="600" class="body-text">SaaS Ecosystem</text>
      </g>

      <!-- Pill 2: Open Source -->
      <g transform="translate(0, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
        <circle cx="-62" cy="0" r="5" fill="#10b981" />
        <text x="-48" y="5" fill="#e5e7eb" font-size="12" font-weight="600" class="body-text">Open-Source Core</text>
      </g>

      <!-- Pill 3: Self-Hosted -->
      <g transform="translate(200, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
        <circle cx="-62" cy="0" r="5" fill="#ec4899" />
        <text x="-48" y="5" fill="#e5e7eb" font-size="12" font-weight="600" class="body-text">Data Sovereignty</text>
      </g>
    </g>

    <!-- Bottom border accent bar -->
    <rect x="-260" y="348" width="520" height="2" rx="1" fill="url(#accentGrad)" opacity="0.7" />
  </g>
</svg>
